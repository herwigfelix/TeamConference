[package]
name = "teamconference-client"
version = "0.5.1"
edition = "2021"
description = "TeamConference-Client (wxWidgets/wxDragon) mit Barrierefreiheits-Fokus"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
futures-util = "0.3"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
opus = "0.3"
crossbeam-channel = "0.5"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
parking_lot = "0.12"
chrono = "0.4"
# Auto-Updater + Hub-API: HTTPS (rustls/ring, keine OpenSSL-/C-Abhängigkeit).
# `json` für send_json/into_json (Hub-Login).
ureq = { version = "2", features = ["json"] }
# Sprachausgabe für Barrierefreiheit: routet über den Screenreader, wo möglich
# (Windows via Tolk → NVDA/JAWS, sonst SAPI; macOS AVFoundation; Linux Speech
# Dispatcher). Läuft nur auf dem UI-Thread (Instanz ist nicht Send auf macOS).
# Nur Desktop (siehe unten); iOS/Android sagen über VoiceOver/TalkBack an.

# Auf Windows zusätzlich das Tolk-Backend aktivieren, damit Ansagen über den
# aktiven Screenreader (NVDA/JAWS) laufen statt nur über SAPI.
[target.'cfg(windows)'.dependencies]
tts = { version = "0.26", features = ["tolk"] }

# Desktop: echtes wxWidgets. iOS/Android: MUi (gleiche wxDragon-API, rendert mit
# SwiftUI bzw. Jetpack Compose) aus ~/Documents/projekte/RustMUi. main.rs bindet
# es per `extern crate mui as wxdragon` unter demselben Namen ein.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
wxdragon = "0.9"
tts = "0.26"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
mui = { path = "../../RustMUi/mui" }

[target.'cfg(target_os = "android")'.dependencies]
cpal = { version = "0.15", features = ["oboe-shared-stdcxx"] }

[package.metadata.mui]
app-name = "TeamConference"
bundle-id = "de.accessyapplications.teamconference"
permissions = ["microphone", "notifications"]
background-audio = true

[package.metadata.mui.usage]
microphone = "Deine Stimme wird an die Personen in deinem Raum übertragen."

[build-dependencies]
# Bettet unter Windows das Anwendungs-Manifest ein (Common Controls v6, DPI).
embed-manifest = "1.4"

[profile.dev]
opt-level = 2
