help:
  keys_title: "Keyboard shortcuts"
  keys_text: |-
    Keyboard shortcuts (on macOS use Cmd instead of Ctrl):

    Ctrl+M  Mute/unmute microphone
    Ctrl+D  Sound off/on (deafen)
    Ctrl+L  Loopback on/off
    Ctrl+S  Stream audio file
    Ctrl+P  Pause/resume streaming
    Ctrl+Shift+S  Stop streaming
    Ctrl+J  Join selected room
    Ctrl+U  Upload file
    Ctrl+H  Download file
    Ctrl+Shift+P  Private message to selected user
    Ctrl+Q  Quit

    Audio shortcuts:
    Ctrl+Shift+Up/Down arrow  Own stream louder/quieter (for everyone)
    Ctrl+Shift+Right/Left arrow  Seek stream 10 s forward/back
    Ctrl+Up/Down arrow  Selected user louder/quieter (locally)

    In the tree: Right/Left arrow expands/collapses, Enter joins a room.
  about_title: "About TeamConference"
  about_text: "TeamConference client\nNative interface with wxWidgets (wxDragon)."

