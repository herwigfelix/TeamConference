help:
  keys_title: "Kurztasten"
  keys_text: |-
    Kurztasten (unter macOS Cmd statt Strg):

    Strg+M  Mikrofon stumm/laut
    Strg+D  Ton aus/an (taub)
    Strg+L  Loopback an/aus
    Strg+S  Audiodatei streamen
    Strg+P  Streaming pausieren/fortsetzen
    Strg+Umschalt+S  Streaming stoppen
    Strg+J  Ausgewähltem Raum beitreten
    Strg+U  Datei hochladen
    Strg+H  Datei herunterladen
    Strg+Umschalt+P  Privatnachricht an ausgewählten Nutzer
    Strg+Q  Beenden

    Audio-Kurztasten:
    Strg+Umschalt+Pfeil hoch/runter  Eigenen Stream lauter/leiser (für alle)
    Strg+Umschalt+Pfeil rechts/links  Stream 10 s vor-/zurückspulen
    Strg+Pfeil hoch/runter  Ausgewählten Nutzer lokal lauter/leiser

    Im Baum: Pfeil rechts/links klappt auf/zu, Enter tritt einem Raum bei.
  about_title: "Über TeamConference"
  about_text: "TeamConference-Client\nNative Oberfläche mit wxWidgets (wxDragon)."

