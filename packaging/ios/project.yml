# XcodeGen-Spezifikation der Xcode-Hülle für den App-Store-Build.
# Die App hat keine eigenen Quellen: ein Skript-Schritt kopiert das fertige
# Rust-Binary (TC_RUST_BINARY) als ausführbare Datei ins Bundle, Xcode kümmert
# sich um Icon, Info.plist, Signierung und Archiv. Aufruf über build-appstore.sh.
name: TeamConference
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: XJ3N4HV6L6
targets:
  TeamConference:
    type: application
    platform: iOS
    sources:
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TeamConference
        PRODUCT_BUNDLE_IDENTIFIER: de.accessyapplications.teamconference
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ARCHS: arm64
        SUPPORTED_PLATFORMS: iphoneos
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        DEBUG_INFORMATION_FORMAT: dwarf
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TC_RUST_BINARY: ""
    postCompileScripts:
      - name: Rust-Binary einsetzen
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ ! -f "$TC_RUST_BINARY" ]; then
            echo "error: TC_RUST_BINARY nicht gefunden: $TC_RUST_BINARY"
            exit 1
          fi
          mkdir -p "$TARGET_BUILD_DIR/$WRAPPER_NAME"
          cp "$TC_RUST_BINARY" "$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
          strip -x "$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
